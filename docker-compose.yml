services: 
  db:  
    image: postgres:16    
    env_file: .env
    volumes: 
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvf_user -d dvf"]
      interval: 5s

  loader: 
    build: ./loader
    env_file: .env
    volumes: 
      - ./data:/data
      - ./sql:/sql
    depends_on:
      db:
        condition: service_healthy
  
  app:
    build: ./app
    env_file: .env
    ports: 
      - "8501:8501" 
    depends_on:
      loader:
        condition: service_completed_successfully

volumes: 
  dbdata:
